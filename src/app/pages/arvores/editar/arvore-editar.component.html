<div class="arvore-container">
  <div class="cabecalho">
    <app-back-button />
    <h1>Editar Árvore</h1>
    @if (arvore()) {
      <button mat-button type="button" class="ver-mapa-btn" (click)="verNoMapa()">
        <mat-icon>map</mat-icon>
        Ver no mapa
      </button>
    }
  </div>

  @if (carregando()) {
    <p class="carregando">Carregando...</p>
  } @else if (!arvore()) {
    <p class="erro">{{ erro() }}</p>
  } @else {
    <mat-card class="form-card">
      <div class="fotos-atuais">
        @for (foto of fotosArvore(); track foto.url) {
          <div class="foto-item">
            <img [src]="foto.url" [alt]="TIPO_FOTO_ARVORE_LABEL[foto.tipo]" />
            <span class="foto-tipo">{{ TIPO_FOTO_ARVORE_LABEL[foto.tipo] }}</span>
          </div>
        }
      </div>

      <div class="form-grid">
        <app-arvore-campos-form [formGroup]="form" />

        @if (erro()) {
          <p class="erro">{{ erro() }}</p>
        }

        <div class="form-acoes">
          <button mat-button type="button" color="warn" [disabled]="excluindo() || salvando()" (click)="excluir()">
            {{ excluindo() ? 'Excluindo...' : 'Excluir registro' }}
          </button>
          <button mat-flat-button color="primary" type="button" [disabled]="salvando() || excluindo()" (click)="salvar()">
            {{ salvando() ? 'Salvando...' : 'Salvar alterações' }}
          </button>
        </div>
      </div>
    </mat-card>
  }
</div>
